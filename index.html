<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mãespace - 42 Anos</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Duru+Sans&family=Doris&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --champagne-gold: #f2e3c6; 
      --text-main: #f8f9fa;
      --blur-bg: rgba(15, 10, 30, 0.65); 
    }

    body { 
      margin: 0; 
      overflow: hidden; 
      background: radial-gradient(circle at 50% 50%, #1a0f2e 0%, #0a0514 50%, #000000 100%);
      color: var(--text-main); 
      touch-action: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    #3d-graph { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #poem-panel {
      position: absolute; 
      bottom: 5vh; 
      left: 50%; 
      transform: translateX(-50%);
      width: 90vw; 
      max-width: 400px;
      max-height: 65vh;
      background: var(--blur-bg);
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 24px; 
      padding: 35px 25px 25px;
      overflow-y: auto; 
      display: none;
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 10;
      transition: all 0.3s ease-out;
    }
    
    #poem-panel h2 { 
      font-family: 'Doris', serif; 
      font-size: 1.6em; 
      color: var(--champagne-gold); 
      margin: 0 0 15px 0; 
      font-weight: 300;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(242, 227, 198, 0.3);
    }
    
    #poem-panel p { 
      font-family: 'Duru Sans', sans-serif;
      font-size: 1.1em; 
      line-height: 1.6; 
      color: var(--text-main); 
      font-weight: 300;
      margin: 0;
      text-align: center;
    }

    #close-btn {
      position: absolute;
      top: -20px;
      right: 20px;
      background: rgba(30, 20, 50, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.2em;
      cursor: pointer;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      z-index: 11;
      backdrop-filter: blur(10px);
    }

    #close-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }
    
    #instructions {
      font-family: 'Duru Sans', sans-serif;
      position: absolute; 
      top: 30px; 
      width: 100%;
      text-align: center;
      pointer-events: none; 
      color: rgba(255,255,255,0.6);
      font-size: 0.9em;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="3d-graph"></div>
<div id="instructions">Explore o Sistema Solar</div>

<div id="poem-panel">
  <button id="close-btn">✕</button>
  <h2 id="poem-title"></h2>
  <p id="poem-text"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.70.0/dist/3d-force-graph.min.js"></script>

<script>
  const elem = document.getElementById('3d-graph');
  const panel = document.getElementById('poem-panel');
  const pTitle = document.getElementById('poem-title');
  const pText = document.getElementById('poem-text');
  const closeBtn = document.getElementById('close-btn');

  // Textura para a aura da Estrela (Mãe) e partículas
  function createGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(0.6, 'rgba(255,255,255,0.2)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const glowTexture = createGlowTexture();

  const getColorByGroup = (group) => {
    switch(group) {
      case 1: return 0xffdf99; // Mãe: Ouro 
      case 2: return 0xb3aebd; // História: Prateado lunar
      case 3: return 0x4488ff; // Família (Adrian/Arthur/Taguaí): Planetas azuis tipo Terra
      case 4: return 0xffb3c6; // Qualidades: Planetas rosados
      case 5: return 0xd4c4fb; // Alegrias: Planetas lilases
      case 6: return 0xa3f7f0; // Poemas: Planetas gelados (ciano)
      case 7: return 0xffffff; // Futuro: Branco
      default: return 0xaaaaaa;
    }
  };

  const Graph = ForceGraph3D()(elem)
    .jsonUrl('data.json')
    .backgroundColor('rgba(0,0,0,0)') 
    .showNavInfo(false)
    .nodeThreeObject(node => {
        // Criamos um "Grupo" para cada nó, assim podemos empilhar a esfera e o brilho
        const group = new THREE.Group();
        
        // A Esfera 3D (O Planeta/Estrela)
        const radius = (node.val || 5) * 0.5;
        const geometry = new THREE.SphereGeometry(radius, 32, 32);
        let material;

        if (node.group === 1) {
            // A Mãe é o Sol: Material que não precisa de luz, brilha por si só
            material = new THREE.MeshBasicMaterial({ color: getColorByGroup(node.group) });
            
            // Adicionamos a coroa solar (Aura)
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: glowTexture, 
                color: 0xffcc00, 
                transparent: true, 
                blending: THREE.AdditiveBlending 
            });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(radius * 5, radius * 5, 1);
            group.add(sprite);
        } else {
            // Os restantes são Planetas Sólidos: Reagem à luz do ambiente
            material = new THREE.MeshStandardMaterial({
                color: getColorByGroup(node.group),
                roughness: 0.7, // Textura de rocha/terra
                metalness: 0.1
            });
        }

        const sphere = new THREE.Mesh(geometry, material);
        group.add(sphere);

        return group;
    })
    .nodeLabel('name') 
    .linkColor(() => 'rgba(255, 255, 255, 0.15)') 
    .linkWidth(0.6)
    .linkDirectionalParticles(2) 
    .linkDirectionalParticleSpeed(d => d.value * 0.001)
    .linkDirectionalParticleWidth(1.2)
    .linkDirectionalParticleColor(() => 'rgba(255, 223, 153, 0.6)');

  Graph.d3Force('charge').strength(-150);

  const scene = Graph.scene();

  // LUZES PARA O EFEITO 3D REALISTA
  // Luz ambiente muito fraca para o lado escuro dos planetas não ficar 100% negro
  scene.add(new THREE.AmbientLight(0x333344));
  
  // Uma luz direcional forte a simular a luz do núcleo a bater nos planetas
  const directionalLight = new THREE.DirectionalLight(0xffffee, 1.5);
  directionalLight.position.set(100, 100, 50);
  scene.add(directionalLight);

  // Injeção de Estrelas de Fundo (A Poeira Estelar em 3D)
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2000;
  const starPos = new Float32Array(starCount * 3);
  
  for(let i=0; i < starCount * 3; i++) {
    starPos[i] = (Math.random() - 0.5) * 2500; 
  }
  
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({
    color: 0xaa99ff, 
    size: 2,
    transparent: true,
    opacity: 0.5,
    map: glowTexture, 
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  (function animateStars() {
    stars.rotation.y += 0.0002; 
    stars.rotation.x += 0.0001;
    requestAnimationFrame(animateStars);
  })();

  Graph.onNodeClick(node => {
    const distance = 120;
    const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
    
    Graph.cameraPosition(
      { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
      node, 
      2500 
    );

    pTitle.innerText = node.name;
    pText.innerText = node.text;
    panel.style.display = 'block';
  });

  closeBtn.addEventListener('click', () => {
    panel.style.display = 'none';
  });

</script>
</body>
</html>

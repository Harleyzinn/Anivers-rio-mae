<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mãespace - 42 Anos</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Duru+Sans&family=Doris&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --champagne-gold: #f2e3c6; 
      --text-main: #f8f9fa;
      --blur-bg: rgba(15, 10, 30, 0.65); /* Mais translúcido e sofisticado */
    }

    body { 
      margin: 0; 
      overflow: hidden; 
      /* O grande truque estético: Fundo de nebulosa profunda no CSS */
      background: radial-gradient(circle at 50% 50%, #1a0f2e 0%, #0a0514 50%, #000000 100%);
      color: var(--text-main); 
      touch-action: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    #3d-graph { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #poem-panel {
      position: absolute; 
      bottom: 5vh; 
      left: 50%; 
      transform: translateX(-50%);
      width: 90vw; 
      max-width: 400px;
      max-height: 65vh;
      background: var(--blur-bg);
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 24px; 
      padding: 35px 25px 25px;
      overflow-y: auto; 
      display: none;
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 10;
      transition: all 0.3s ease-out;
    }
    
    #poem-panel h2 { 
      font-family: 'Doris', serif; 
      font-size: 1.6em; 
      color: var(--champagne-gold); 
      margin: 0 0 15px 0; 
      font-weight: 300;
      letter-spacing: 1px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(242, 227, 198, 0.3);
    }
    
    #poem-panel p { 
      font-family: 'Duru Sans', sans-serif;
      font-size: 1.1em; 
      line-height: 1.6; 
      color: var(--text-main); 
      font-weight: 300;
      margin: 0;
      text-align: center;
    }

    #close-btn {
      position: absolute;
      top: -20px;
      right: 20px;
      background: rgba(30, 20, 50, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.2em;
      cursor: pointer;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      z-index: 11;
      backdrop-filter: blur(10px);
    }

    #close-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.2);
    }
    
    #instructions {
      font-family: 'Duru Sans', sans-serif;
      position: absolute; 
      top: 30px; 
      width: 100%;
      text-align: center;
      pointer-events: none; 
      color: rgba(255,255,255,0.6);
      font-size: 0.9em;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="3d-graph"></div>
<div id="instructions">Explore o Universo</div>

<div id="poem-panel">
  <button id="close-btn">✕</button>
  <h2 id="poem-title"></h2>
  <p id="poem-text"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.70.0/dist/3d-force-graph.min.js"></script>

<script>
  const elem = document.getElementById('3d-graph');
  const panel = document.getElementById('poem-panel');
  const pTitle = document.getElementById('poem-title');
  const pText = document.getElementById('poem-text');
  const closeBtn = document.getElementById('close-btn');

  // Textura suave para as estrelas
  function createGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(0.6, 'rgba(255,255,255,0.2)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const glowTexture = createGlowTexture();

  // Paleta de cores sofisticada
  const getColorByGroup = (group) => {
    switch(group) {
      case 1: return '#ffdf99'; // Núcleo: Ouro brilhante
      case 2: return '#b3aebd'; // História: Prata suave
      case 3: return '#8bb8e8'; // Família: Azul ciano claro
      case 4: return '#ffb3c6'; // Qualidades: Rosa ouro
      case 5: return '#d4c4fb'; // Alegrias: Lilás suave
      case 6: return '#a3f7f0'; // Poemas: Verde água claro
      case 7: return '#ffffff'; // Futuro: Branco puro
      default: return '#ffffff';
    }
  };

  const Graph = ForceGraph3D()(elem)
    .jsonUrl('data.json')
    .backgroundColor('rgba(0,0,0,0)') // Fundo transparente para o CSS brilhar por trás
    .showNavInfo(false)
    .nodeThreeObject(node => {
        const material = new THREE.SpriteMaterial({
            map: glowTexture,
            color: getColorByGroup(node.group),
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const sprite = new THREE.Sprite(material);
        const size = (node.val || 5) * 1.8; // Nós ligeiramente maiores pro mobile
        sprite.scale.set(size, size, 1);
        return sprite;
    })
    .nodeLabel('name') 
    .linkColor(() => 'rgba(255, 255, 255, 0.15)') 
    .linkWidth(0.6)
    .linkDirectionalParticles(2) 
    .linkDirectionalParticleSpeed(d => d.value * 0.001)
    .linkDirectionalParticleWidth(1.2)
    .linkDirectionalParticleColor(() => 'rgba(255, 223, 153, 0.6)');

  // Força o espalhamento para ficar uma teia grande e bonita
  Graph.d3Force('charge').strength(-150);

  // Injeção de Estrelas de Fundo (A Poeira Estelar em 3D)
  const scene = Graph.scene();
  const starGeo = new THREE.BufferGeometry();
  const starCount = 2000;
  const starPos = new Float32Array(starCount * 3);
  
  for(let i=0; i < starCount * 3; i++) {
    starPos[i] = (Math.random() - 0.5) * 2500; 
  }
  
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({
    color: 0xaa99ff, 
    size: 2,
    transparent: true,
    opacity: 0.5,
    map: glowTexture, 
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // Gira o universo devagarzinho
  (function animateStars() {
    stars.rotation.y += 0.0002; 
    stars.rotation.x += 0.0001;
    requestAnimationFrame(animateStars);
  })();

  // Click e Câmera Mobile Friendly
  Graph.onNodeClick(node => {
    // Afastamento da câmera adaptado para celular (não chega tão perto a ponto de bugar a tela)
    const distance = 120;
    const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
    
    Graph.cameraPosition(
      { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
      node, 
      2500 
    );

    pTitle.innerText = node.name;
    pText.innerText = node.text;
    panel.style.display = 'block';
  });

  closeBtn.addEventListener('click', () => {
    panel.style.display = 'none';
  });

</script>
</body>
</html>

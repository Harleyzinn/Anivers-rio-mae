<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mãespace - 42 Anos</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Duru+Sans&family=Doris&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --champagne-gold: rgba(224, 202, 158, 0.9); 
      --deep-space: #020205; 
      --text-main: #e8e8e8;
      --blur-bg: rgba(10, 15, 25, 0.75); 
    }

    body { 
      margin: 0; 
      overflow: hidden; 
      background-color: var(--deep-space); 
      color: var(--text-main); 
      touch-action: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    #3d-graph { width: 100vw; height: 100vh; }
    
    #poem-panel {
      position: absolute; 
      bottom: 6vh; 
      left: 50%; 
      transform: translateX(-50%);
      width: 88vw; 
      max-width: 420px;
      max-height: 60vh;
      background: var(--blur-bg);
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 20px; 
      padding: 30px 20px 25px;
      overflow-y: auto; 
      display: none;
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      z-index: 10;
      transition: all 0.4s ease;
    }
    
    #poem-panel h2 { 
      font-family: 'Doris', serif; 
      font-size: 1.4em; 
      color: var(--champagne-gold); 
      margin: 0 0 15px 0; 
      font-weight: 300;
      letter-spacing: 1px;
      text-align: center;
    }
    
    #poem-panel p { 
      font-family: 'Duru Sans', sans-serif;
      font-size: 1.05em; 
      line-height: 1.6; 
      color: var(--text-main); 
      font-weight: 300;
      margin: 0;
      text-align: justify;
    }

    #close-btn {
      position: absolute;
      top: -20px;
      right: 15px;
      background: var(--blur-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.1em;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      z-index: 11;
      backdrop-filter: blur(15px);
    }

    #close-btn:active {
      transform: scale(0.9);
      color: #fff;
    }
    
    #instructions {
      font-family: 'Duru Sans', sans-serif;
      position: absolute; 
      top: 25px; 
      width: 100%;
      text-align: center;
      pointer-events: none; 
      color: rgba(255,255,255,0.4);
      font-size: 0.85em;
      font-weight: 300;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="3d-graph"></div>
<div id="instructions">Toque nas estrelas para explorar a constelação</div>

<div id="poem-panel">
  <button id="close-btn">✕</button>
  <h2 id="poem-title"></h2>
  <p id="poem-text"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.70.0/dist/3d-force-graph.min.js"></script>

<script>
  const elem = document.getElementById('3d-graph');
  const panel = document.getElementById('poem-panel');
  const pTitle = document.getElementById('poem-title');
  const pText = document.getElementById('poem-text');
  const closeBtn = document.getElementById('close-btn');

  // Gerador de Textura de Estrela via Canvas (Não depende de imagens externas)
  function createGlowTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255,255,255,1)');
    gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
    gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(canvas);
  }

  const glowTexture = createGlowTexture();

  // Inicializa o Grafo
  const Graph = ForceGraph3D()(elem)
    .jsonUrl('data.json')
    .backgroundColor('#020205') 
    .showNavInfo(false)
    .nodeThreeObject(node => {
        // Cores: Ouro pra ela, Azul pros filhos/lar, Branco azulado pro resto
        const color = (node.group === 1) ? '#e0ca9e' : (node.group === 3 ? '#8aa8c2' : '#d4e2ed');
        
        const material = new THREE.SpriteMaterial({
            map: glowTexture,
            color: color,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        
        const sprite = new THREE.Sprite(material);
        const size = (node.val || 5) * 1.5; 
        sprite.scale.set(size, size, 1);
        return sprite;
    })
    .nodeLabel('name') 
    .linkColor(() => 'rgba(255, 255, 255, 0.12)') 
    .linkWidth(0.5)
    .linkDirectionalParticles(2) 
    .linkDirectionalParticleSpeed(d => d.value * 0.0015)
    .linkDirectionalParticleWidth(1.5)
    .linkDirectionalParticleColor(() => 'rgba(224, 202, 158, 0.8)');

  // Interação ao clicar no nó
  Graph.onNodeClick(node => {
    const distance = 80;
    const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
    
    Graph.cameraPosition(
      { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
      node, 
      2000 // Animação suave de câmera
    );

    // Atualiza e mostra o painel
    pTitle.innerText = node.name;
    pText.innerText = node.text;
    panel.style.display = 'block';
  });

  // Fecha o painel apenas no botão X
  closeBtn.addEventListener('click', () => {
    panel.style.display = 'none';
  });

</script>
</body>
</html>
